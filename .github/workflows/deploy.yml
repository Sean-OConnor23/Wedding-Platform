name: Production Multi-Service Deployment CI/CD

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build & Deploy Next.js Frontend
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Install Node.js Execution Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Web Application Assets
        env:
          NEXT_PUBLIC_API_BASE_URL: https://wedding-api-prod-server.azurewebsites.net/api
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Push Static Assets to Azure Edge Slots
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          output_location: ".next"
          skip_app_build: true

  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Python Function Server
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Package Backend Code
        run: |
          cd backend
          zip -r -q ../deploy.zip . -x "local.settings.json" "secret.settings.json" ".venv/*" "__pycache__/*"

      - name: Az CLI Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Package to Flex Consumption (Remote Build)
        run: |
          az functionapp deployment source config-zip \
            --name "wedding-api-prod-server" \
            --resource-group "Wedding-Platform" \
            --src "deploy.zip" \
            --build-remote true
    


